[project]
name = "zoologist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Stephany Vargas", email = "20273888+stephanyvargas@users.noreply.github.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.163.2",
    "google-cloud-storage>=3.17.1",
    "pandas<3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
zoologist = "zoologist:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipykernel>=7.4.0",
    "seaborn>=0.13.2",
]
